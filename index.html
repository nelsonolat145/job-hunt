<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport"content="width=device-width, initial-scale=1.0"> <title>Job Application Form</title> <style> body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; } .form-container { max-width: 600px; background: #ffffff; margin: 30px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); } h2 { margin-top: 0; color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; } .form-group { margin-bottom: 20px; } label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; } input[type="text"], input[type="email"], input[type="tel"], select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; } input[type="file"] { padding: 5px 0; } textarea { resize: vertical; height: 100px; } button { background-color: #4CAF50; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; transition: background 0.3s; } button:hover { background-color: #45a049; } </style> </head> <body> <div class="form-container"> <h2>Job Application</h2> <!-- IMPORTANT: Replace rojr801@gmail.com with your real email address --> <form action="https://formsubmit.co"method="POST" enctype="multipart/form-data"> <!-- Anti-Spam HoneyPot (Hidden from users) --><input type="text" name="_honey" style="display:none"> <!-- Disable Captcha (Optional: Remove if you want a captcha check) --> <input type="hidden" name="_captcha" value="false"> <divclass="form-group"> <label for="name">Full Name *</label> <input type="text" id="name"name="Full Name" required> </div> <div class="form-group"> <label for="email">Email Address *</label> <input type="email" id="email" name="Email" required> </div> <div class="form-group"> <label for="phone">Phone Number *</label> <input type="tel" id="phone" name="Phone Number" required> </div> <div class="form-group"> <label for="position">Position Applied For *</label> <select id="position" name="Position" required> <option value="">-- Select a Position --</option> <option value="Frontend Developer">Frontend Developer</option> <optionvalue="Backend Developer">Backend Developer</option> <option value="UI/UX Designer">UI/UX Designer</option> <option value="Project Manager">Project Manager</option> </select> </div> <div class="form-group"> <label for="resume">Upload Resume (PDF, Docx) *</label> <inputtype="file" id="resume" name="Resume" accept=".pdf,.doc,.docx" required> </div> <divclass="form-group"> <label for="coverletter">Cover Letter / Additional Information</label> <textarea id="coverletter" name="Cover Letter"></textarea> </div> <buttontype="submit">Submit Application</button> </form> </div> </body> </html>
